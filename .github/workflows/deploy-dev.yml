on:
  push:
    branches: develop
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - '**/.gitignore'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #V7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 #v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubWorkflow
          aws-region: eu-west-2

      # assume the relevant role via AWS Profile
      - run: sh ./.github/scripts/assume-role-profile.sh
        env:
          ROLE_ARN: ${{ secrets.ASSUMED_ROLE }}
          EXTERNAL_ID: ${{ secrets.EXTERNAL_ID }}

      # install dependencies into a lambda layer
      - run: sh ./.github/scripts/build-layer.sh

      # sam build
      - run: sam build --use-container

      # deploy
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name kofax-scanning-processor --resolve-s3 --capabilities CAPABILITY_IAM --region eu-west-2 --profile assumed-role --parameter-overrides Environment=development
